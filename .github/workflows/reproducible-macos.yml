name: Reproduce macOS native prebuilts

on:
  workflow_dispatch:
  push:
    branches: [macos-reproducible-native-prebuilts]

permissions:
  contents: read

jobs:
  nix-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Test artifact and Mach-O audits
        run: |
          python3 -m unittest discover -s reproducible -p 'test_ci_artifacts.py' -v
          python3 -m unittest discover -s reproducible/macos -p 'test_*.py' -v
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
        with:
          extra_nix_config: |
            sandbox = true
            sandbox-fallback = false
      - name: Compare a forced clean rebuild of both link modes
        run: ./reproducible/macos/verify.sh
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get --no-example
      - name: Package and smoke-test the Nix outputs
        env:
          REPRO_TARGET: ${{ matrix.target }}
        run: |
          dart --packages=.dart_tool/package_config.json tool/build_macos_prebuilt.dart
          dart --packages=.dart_tool/package_config.json tool/smoke_prebuilt.dart "build/macos-prebuilts/mwc_wallet-$REPRO_TARGET-dynamic.dylib"
          dart --packages=.dart_tool/package_config.json tool/prebuilt_manifest.dart --artifacts build/macos-prebuilts --output build/macos-release
      - name: Record the exact GitHub run and payload hashes
        env:
          REPRO_RUNNER: ${{ matrix.runner }}
        run: python3 reproducible/ci_artifacts.py record build/macos-release --runner "$REPRO_RUNNER"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: reproducible-macos-${{ matrix.target }}-attempt-${{ github.run_attempt }}
          path: build/macos-release/*
          if-no-files-found: error
          compression-level: 1
